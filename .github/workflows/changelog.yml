name: Changelog

# Requires a CHANGELOG.md entry on every pull request unless the PR opts out
# with the `no-changelog` label. This is the DELIBERATE exception to the org's
# opt-in changelog model: this package's CHANGELOG ships as a published
# artifact, so the default is an entry and only trivial PRs bypass it.
# Re-affirmed 2026-08-03 after briefly converting to opt-in. Dependabot PRs
# are exempt automatically.
#
# Self-contained on purpose: this public repository cannot call reusable
# workflows that live in the org's private repositories — such calls fail at
# workflow load ("workflow file issue", 0s) before any step runs.
#
# No base-branch filter: the gate fires on every pull request, whatever the
# target branch. Both steps share the bypass guard, so `no-changelog` PRs
# skip the checkout entirely and the check reports success immediately.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  changelog:
    name: CHANGELOG updated
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'no-changelog')
                && github.event.pull_request.user.login != 'dependabot[bot]' }}
        with:
          fetch-depth: 0
      - name: Require a CHANGELOG.md entry
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'no-changelog')
                && github.event.pull_request.user.login != 'dependabot[bot]' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if git diff --name-only "$BASE_SHA"...HEAD | grep -qxF 'CHANGELOG.md'; then
            echo "CHANGELOG.md updated."
          else
            echo "::error::This PR does not update CHANGELOG.md. Add an entry under [Unreleased], or apply the 'no-changelog' label for trivial changes."
            exit 1
          fi
