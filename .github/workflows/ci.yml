name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-syntax:
    name: Lint, Syntax & Unit (Node 20)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # 20 is the advertised floor (engines.node >=20.0.0). vitest 4+
          # requires Node >=20, and 18 is past end-of-life.
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Syntax check all source files
        run: npm run syntax-check

      - name: Lint
        run: npm run lint --if-present

      - name: Unit tests
        run: npm test --if-present
