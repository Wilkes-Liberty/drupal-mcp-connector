name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Explicit read-only token. actions: read lets setup-node restore the npm cache.
# The repository default is already read; do not grant write here.
permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Display name is the master required status check. Renaming it without
  # updating branch protection blocks every pull request.
  lint-and-syntax:
    name: Lint, Syntax & Unit (Node 20)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # 20 is the advertised floor (engines.node >=20.0.0). vitest 4+
          # requires Node >=20, and 18 is past end-of-life.
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: npm run check
        run: npm run check

  # Proves the Dockerfile still builds. Never logs in, never pushes, never
  # signs. The release workflow is the only publisher (DEV-923).
  container-image:
    name: Container image (build only)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: drupal-mcp-connector:ci
          provenance: false
          sbom: false

      - name: Smoke the loaded image
        run: docker run --rm drupal-mcp-connector:ci node -e "console.log('ok')"

  # Not a required status check. Do not rename lint-and-syntax or add this
  # job to branch protection. Failures are visible on the PR without blocking
  # merge (DEV-866 increment 2, c-3).
  eval-http:
    name: HTTP transport evals (non-required)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: npm run eval:http
        run: npm run eval:http
