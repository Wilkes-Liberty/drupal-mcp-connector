name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Explicit read-only token. actions: read lets setup-node restore the npm cache.
# The repository default is already read; do not grant write here.
permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Display name is the master required status check. Renaming it without
  # updating branch protection blocks every pull request.
  lint-and-syntax:
    name: Lint, Syntax & Unit (Node 20)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # 20 is the advertised floor (engines.node >=20.0.0). vitest 4+
          # requires Node >=20, and 18 is past end-of-life.
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: npm run check
        run: npm run check

      # #464: a `uses:` ref that does not exist fails at "Set up job", and the
      # release workflow is the first place some steps ever run. Resolve every
      # action reference on the PR instead. Network-only; not part of
      # `npm run check` so the release job never depends on the GitHub API.
      - name: Resolve every workflow action reference
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run lint:actions

  # DEV-841: prove an rc cannot take npm/GHCR `latest`, and a final does.
  # Uses the same docker/metadata-action wiring as release.yml. Never publishes.
  release-channel:
    name: Release channel (dry-run)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: RC cannot take npm latest
        run: node scripts/release-channel.js --version 5.1.0-rc.1 --allow-floating --expect-npm-tag next

      - name: Final takes npm latest
        run: node scripts/release-channel.js --version 5.1.0 --allow-floating --expect-npm-tag latest

      - name: Channel for rc image tags
        id: rc
        run: node scripts/release-channel.js --version 5.1.0-rc.1 --allow-floating --github-output

      - name: GHCR metadata for 5.1.0-rc.1
        id: rc-meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/wilkes-liberty/drupal-mcp-connector
          flavor: |
            latest=${{ steps.rc.outputs.floating_tags }}
          tags: |
            type=raw,value=${{ steps.rc.outputs.version }}
            type=raw,value=v${{ steps.rc.outputs.version }}
            type=semver,pattern={{version}},value=${{ steps.rc.outputs.semver_value }},enable=${{ steps.rc.outputs.is_semver }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.rc.outputs.semver_value }},enable=${{ steps.rc.outputs.floating_tags }}
            type=semver,pattern={{major}},value=${{ steps.rc.outputs.semver_value }},enable=${{ steps.rc.outputs.floating_tags }}

      - name: Assert rc image tags omit latest / X / X.Y
        env:
          TAGS: ${{ steps.rc-meta.outputs.tags }}
        run: node scripts/release-channel.js --version 5.1.0-rc.1 --allow-floating --assert-image-tags --tags "$TAGS"

      - name: Channel for final image tags
        id: final
        run: node scripts/release-channel.js --version 5.1.0 --allow-floating --github-output

      - name: GHCR metadata for 5.1.0
        id: final-meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/wilkes-liberty/drupal-mcp-connector
          flavor: |
            latest=${{ steps.final.outputs.floating_tags }}
          tags: |
            type=raw,value=${{ steps.final.outputs.version }}
            type=raw,value=v${{ steps.final.outputs.version }}
            type=semver,pattern={{version}},value=${{ steps.final.outputs.semver_value }},enable=${{ steps.final.outputs.is_semver }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.final.outputs.semver_value }},enable=${{ steps.final.outputs.floating_tags }}
            type=semver,pattern={{major}},value=${{ steps.final.outputs.semver_value }},enable=${{ steps.final.outputs.floating_tags }}

      - name: Assert final image tags include latest / X / X.Y
        env:
          TAGS: ${{ steps.final-meta.outputs.tags }}
        run: node scripts/release-channel.js --version 5.1.0 --allow-floating --assert-image-tags --tags "$TAGS"

      - name: Summarize
        env:
          RC_TAGS: ${{ steps.rc-meta.outputs.tags }}
          FINAL_TAGS: ${{ steps.final-meta.outputs.tags }}
        run: |
          set -euo pipefail
          {
            echo "## Release channel dry-run (DEV-841)"
            echo
            echo "\`5.1.0-rc.1\` → npm \`next\`, GitHub prerelease, GHCR tags:"
            echo
            echo "\`\`\`"
            echo "${RC_TAGS}"
            echo "\`\`\`"
            echo
            echo "\`5.1.0\` → npm \`latest\`, GHCR tags:"
            echo
            echo "\`\`\`"
            echo "${FINAL_TAGS}"
            echo "\`\`\`"
          } >> "${GITHUB_STEP_SUMMARY}"

  # Proves the Dockerfile still builds. Never logs in, never pushes, never
  # signs. The release workflow is the only publisher (DEV-923).
  container-image:
    name: Container image (build only)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: drupal-mcp-connector:ci
          provenance: false
          sbom: false

      - name: Smoke the loaded image
        run: docker run --rm drupal-mcp-connector:ci node -e "console.log('ok')"

  # Not a required status check. Do not rename lint-and-syntax or add this
  # job to branch protection. Failures are visible on the PR without blocking
  # merge (DEV-866 increment 2, c-3).
  eval-http:
    name: HTTP transport evals (non-required)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: npm run eval:http
        run: npm run eval:http

  # Not a required status check. Source-mutant kills for the increment-3
  # security sites (DEV-866). Failures are visible without blocking merge.
  eval-mutants:
    name: HTTP transport mutants (non-required)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: npm run eval:mutants
        run: npm run eval:mutants
