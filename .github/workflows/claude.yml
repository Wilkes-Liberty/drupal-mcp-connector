name: Claude

# Lets a maintainer tag `@claude` on an issue or PR and have Claude act on this
# repo and open a PR. This repo is public, so the job is inlined and
# self-contained (a private org reusable workflow cannot be consumed here).
#
# The `if:` guards below only pass event bodies to `contains(...)` (a boolean
# test); no untrusted event data reaches any `run:`/shell context — so there is
# no workflow-injection surface.
#
# The author gate is load-bearing on a public repo: without it, any GitHub
# account could comment @claude and consume the org's Claude quota.
#
# INERT until: the Claude GitHub App is installed on this repo and the
# CLAUDE_CODE_OAUTH_TOKEN org Actions secret is made visible to it.

on:
  issue_comment:               { types: [created] }
  pull_request_review_comment: { types: [created] }
  pull_request_review:         { types: [submitted] }
  issues:                      { types: [opened] }

permissions:
  contents: write        # create branches / commits on a PR
  issues: write          # respond on issues
  pull-requests: write   # open PRs, comment on PRs
  # The action exchanges a GitHub OIDC token for its app credentials in every
  # auth mode -- the first activation run failed without this.
  id-token: write

concurrency:
  # One Claude run per issue/PR at a time; a stale run is left to finish.
  group: claude-${{ github.workflow }}-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    if: |
      !endsWith(github.actor, '[bot]') && (
        (github.event_name == 'issue_comment'               && contains(github.event.comment.body || '', '@claude') && contains(fromJSON('["MEMBER","OWNER","COLLABORATOR"]'), github.event.comment.author_association)) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body || '', '@claude') && contains(fromJSON('["MEMBER","OWNER","COLLABORATOR"]'), github.event.comment.author_association)) ||
        (github.event_name == 'pull_request_review'         && contains(github.event.review.body  || '', '@claude') && contains(fromJSON('["MEMBER","OWNER","COLLABORATOR"]'), github.event.review.author_association)) ||
        (github.event_name == 'issues'                      && contains(github.event.issue.body   || '', '@claude') && contains(fromJSON('["MEMBER","OWNER","COLLABORATOR"]'), github.event.issue.author_association))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --max-turns 15
            --append-system-prompt "Follow this repository's CONTRIBUTING.md. Never add AI/Claude/Anthropic attribution to commits, PRs, code, or docs (no Co-Authored-By, no 'Generated with', no bot markers). Open a pull request for review and STOP — never merge, publish, or release; those are human-triggered."
