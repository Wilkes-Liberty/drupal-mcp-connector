version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # graphql 17+ dropped Node 20 (`^22 || ^24 || >=26`). This package still
      # advertises engines.node >=20.0.0, so a 17.x bump reintroduces EBADENGINE
      # on the supported floor (#544). Revisit when the Node floor moves to 22+.
      - dependency-name: graphql
        versions: [">=17.0.0"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
